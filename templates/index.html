<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>File Analyzer</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
        }

        button{
            padding:15px 25px;
            font-size:18px;
            cursor:pointer;
        }

        #result{
            margin-top:25px;
            font-size:18px;
        }

    </style>

</head>
<body>

<h1>Сервис скачивания файлов</h1>

<button onclick="downloadFiles()">
    Скачать данные
</button>

<div id="result"></div>

<script>

    async function downloadFiles(){

        document.getElementById("result").innerHTML =
        "Начинаю скачивание...";


        fetch("/download", {
            method:"POST"
        });


        let interval = setInterval(async function(){


            const response = await fetch("/progress");


            const data = await response.json();


            document.getElementById("result").innerHTML =
            `
            <p>Статус: ${data.status}</p>
            <p>${data.message}</p>
            <p>Скачано: ${data.downloaded}</p>
            `;


            if(data.status === "Завершено"){

                clearInterval(interval);

            }


        },2000);


    }

</script>

</body>
</html>
